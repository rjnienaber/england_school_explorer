# Fetches the latest DfE, GIAS and Ofsted data, rebuilds the site and publishes it to
# GitHub Pages. Runs monthly (after Ofsted's monthly data and before the new month's
# inspections pile up), on pushes to master, and on demand from the Actions tab.
#
# The monthly schedule and manual runs always get freshly downloaded data: the cache is not
# restored and `fetch --force` downloads everything again. A push to master restores the
# data/ cache for this month and these source.ts files and runs `fetch` without --force, which
# skips files already there, so a push downloads nothing when a cache exists (the data is at
# most a month old, and the next scheduled run refreshes it). The cache key has the hash of
# every dimensions/*/source.ts, so changing a source refetches everything; there are no
# restore-keys on purpose, so an old copy of a source whose query changed is never reused.
# The downloaded files are saved afterwards so that pull request runs (ci.yml) start warm.
#
# On the monthly schedule and on manual runs (never on a push) the joined dataset is also
# published as a GitHub Release, data-YYYY-MM, marked latest (see the `release` job).
name: Deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 10 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      month: ${{ steps.month.outputs.month }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push'
        uses: actions/cache/restore@v6
        with:
          path: data
          key: data-${{ steps.month.outputs.month }}-${{ hashFiles('dimensions/*/source.ts') }}
      # Both write the per-source download sizes to the run summary
      - if: github.event_name == 'push'
        run: npm run fetch
      - if: github.event_name != 'push'
        run: npm run fetch -- --force
      # Same key as ci.yml. A cache can't be overwritten, so this only adds one when none exists
      # for this month and these sources (a "Unable to reserve cache" warning is normal otherwise).
      - uses: actions/cache/save@v6
        with:
          path: data
          key: data-${{ steps.month.outputs.month }}-${{ hashFiles('dimensions/*/source.ts') }}
      - run: npm run build:release
      # Reports the sizes in the run summary. Not a gate here (pull requests are): a source
      # growing on its own should not stop the monthly refresh.
      - run: curl -fsSL -o "$RUNNER_TEMP/previous-manifest.json" https://rjnienaber.github.io/england_school_explorer/data/manifest.json || true
      - run: npm run check-budgets -- --previous "$RUNNER_TEMP/previous-manifest.json"
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # The dataset files (schools.csv, england_schools.sqlite, fields.csv, the primary_* and england_primary_* equivalents,
      # sources.csv, NOTES.md, .gz copies and a zip). They
      # are written on every run so a broken export shows up on pushes, but only kept for a release.
      # The last release's fields.csv is only for the "fields added or removed" note.
      - run: curl -fsSL -o "$RUNNER_TEMP/previous-fields.csv" https://github.com/${{ github.repository }}/releases/latest/download/fields.csv || true
      - run: curl -fsSL -o "$RUNNER_TEMP/previous-primary-fields.csv" https://github.com/${{ github.repository }}/releases/latest/download/primary_fields.csv || true
      - run: npm run export-release -- --month "${{ steps.month.outputs.month }}" --previous-fields "$RUNNER_TEMP/previous-fields.csv" --previous-primary-fields "$RUNNER_TEMP/previous-primary-fields.csv"
      - if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Publishes the dataset as the release data-YYYY-MM and marks it latest, so
  # https://github.com/<repo>/releases/latest/download/<file> is a stable link. A re-run in the same
  # month replaces the assets and notes of that month's release. Only scheduled and manual runs
  # get here; the other jobs keep read-only contents access.
  release:
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: data-${{ needs.build.outputs.month }}
      MONTH: ${{ needs.build.outputs.month }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Create or update the release
        run: |
          assets=(release/schools.csv release/schools.csv.gz release/england_schools.sqlite release/england_schools.sqlite.gz release/fields.csv release/sources.csv release/england_school_explorer-data.zip release/primary_schools.csv release/primary_schools.csv.gz release/england_primary_schools.sqlite release/england_primary_schools.sqlite.gz release/primary_fields.csv)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "Data $MONTH" --notes-file release/NOTES.md --latest
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "Data $MONTH" --notes-file release/NOTES.md --latest
          fi

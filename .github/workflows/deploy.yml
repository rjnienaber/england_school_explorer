# Fetches the latest DfE, GIAS and Ofsted data, rebuilds the site and publishes it to
# GitHub Pages. Runs monthly (after Ofsted's monthly data and before the new month's
# inspections pile up), on pushes to master, and on demand from the Actions tab.
name: Deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 10 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run fetch
      - run: npm run build:release
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
